name: Build Realme SM8250 Kernel (Entropy-tweak KSU)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison build-essential flex git \
          libssl-dev libelf-dev lld llvm \
          python3 python-is-python3 \
          zip unzip cpio rsync curl \
          gcc g++ \
          binutils-aarch64-linux-gnu

    - name: Clone Clang 20
      run: |
        git clone --depth=1 https://gitlab.com/provasishh/clang-20.git tc

    - name: Setup ReSukiSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

    - name: Build & Package Kernel
      run: |
        echo "Cloning AnyKernel"
        git clone https://github.com/yassshhhh15/AnyKernel3.git --depth=1 anykernel

        DT=$(date +"%Y%m%d%H%M")
        echo "DT=${DT}" >> $GITHUB_ENV
        config=vendor/kona-perf_defconfig

        CROSS_COMPILE=$(pwd)/tc/aarch64-linux-android-4.9/bin/aarch64-linux-android-
        KERNEL_ARCH=arm64
        KERNEL_OUT=$(pwd)/out
        export KERNEL_SRC=${KERNEL_OUT}
        export CLANG_TRIPLE=aarch64-linux-gnu-
        OUT_DIR=${KERNEL_OUT}
        ARCH=${KERNEL_ARCH}

        TARGET_KERNEL_MAKE_ENV="CC=$(pwd)/tc/clang/bin/clang"

        compile() {
          echo "Compiling kernel..."

          make O=${OUT_DIR} ${TARGET_KERNEL_MAKE_ENV} \
            LLVM_IAS=1 \
            ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            ${config}

          echo "=== Appending oplus.config ==="
          cat arch/arm64/configs/vendor/oplus.config >> ${OUT_DIR}/.config

          # Disable CC_WERROR in CI to prevent new warnings from failing build
          echo "# CONFIG_CC_WERROR is not set" >> ${OUT_DIR}/.config

          echo "=== Running olddefconfig ==="
          make O=${OUT_DIR} ${TARGET_KERNEL_MAKE_ENV} \
            LLVM_IAS=1 \
            ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig

          make ARCH=${ARCH} \
            CROSS_COMPILE=${CROSS_COMPILE} \
            LLVM_IAS=1 \
            O=${OUT_DIR} \
            ${TARGET_KERNEL_MAKE_ENV} \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            -j8
        }

        copy_images() {
          echo "Copying compiled images to AnyKernel..."
          cp out/arch/arm64/boot/Image anykernel/
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img anykernel/
          fi
          if [ -f out/arch/arm64/boot/dtb ]; then
            cp out/arch/arm64/boot/dtb anykernel/
          fi
          # Clean up Git folder and readme from anykernel directory
          rm -rf anykernel/.git anykernel/README.md anykernel/.github anykernel/*.DS_Store
        }

        compile
        copy_images

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4
      with:
        name: Entropy-tweak-KSU-v1.2-${{ env.DT }}
        path: anykernel/
